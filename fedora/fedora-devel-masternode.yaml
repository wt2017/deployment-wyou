apiVersion: v1
kind: Pod
metadata:
 name: fedora-devel-masternode
 namespace: default
spec:
 #hostNetwork: true
 #hostIPC: true
 nodeName: fedora
 containers:
 - name: fedora-devel-masternode
   #image: docker.io/library/fedora
   image: localhost/fedora-devel:v0.0.3
   imagePullPolicy: Never
   securityContext:
     privileged: true
   command: [ "/bin/bash", "-c", "--" ]       # You need to run some task inside a container to keep it running
   args: [ "while true; do sleep 10; done;" ]
 restartPolicy: Never
 tolerations:
 - key: "key"
   operator: "Exists"
   effect: "NoSchedule"
