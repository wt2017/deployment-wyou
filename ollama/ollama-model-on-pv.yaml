apiVersion: v1
kind: Service
metadata:
  name: ollama-service
  namespace: default
spec:
  selector:
    app: ollama-model
  ports:
    - protocol: TCP
      port: 13140
      targetPort: 11434
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-model-on-pv
  namespace: default
spec:
  replicas: 1  # Using 1 replica since we're using GPU
  selector:
    matchLabels:
      app: ollama-model
  template:
    metadata:
      labels:
        app: ollama-model
      # Removed TTL annotation as it's not working as expected
    spec:
      hostNetwork: true
      hostIPC: true
      containers:
      - name: ollama-model-on-pv
        image: docker.io/ollama/ollama:0.15.6-0-g099a0f1-dirty
        imagePullPolicy: Never
        command: ["ollama"]
        args: ["serve"]
        resources:
          limits:
            nvidia.com/gpu: 1
        ports:
        - containerPort: 11434
          protocol: TCP
        livenessProbe:
          tcpSocket:
            port: 11434
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 11434
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: ollama-storage
          mountPath: /root/.ollama
      terminationGracePeriodSeconds: 60
      volumes:
      - name: ollama-storage
        persistentVolumeClaim:
          claimName: pvc-ollama
      tolerations:
      - key: "key"
        operator: "Exists"
        effect: "NoSchedule"
